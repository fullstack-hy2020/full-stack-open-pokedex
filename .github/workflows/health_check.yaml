name: Healthcheck Schedule

on:
  schedule:
    - cron: "*/2 * * * *"

jobs:
  ping_server:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed service URL
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://full-stack-open-pokedex-0i98.onrender.com/health
          max-attempts: 3
