name: Testing stuff

on:
  push:
    branches:
      - main

jobs:
  a_test_job:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
      - name: join commit messages and search skip, set as env variable
        id: vars
        env:
          SKIPFOUND: ${{ contains( join(github.event.commits.*.message, ' '), '#skip' ) }}
        run: echo "SKIP=$SKIPFOUND" >> "$GITHUB_ENV"
      - name: github context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - name: commits
        env:
          COMMITS: ${{ toJson(github.event.commits) }}
        run: echo "$COMMITS"
      - name: commit messages
        env:
          COMMIT_MESSAGES: ${{ toJson(github.event.commits.*.message) }}
        run: echo "$COMMIT_MESSAGES"
      - name: test using skip env variable
        run: echo "$SKIP"
