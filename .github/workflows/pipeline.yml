name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  simple_deployment_pipeline:
    runs-on: ubuntu-20.04
    outputs:
      SKIP: ${{ steps.testskip.outputs.SKIP }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: join commit messages and search skip, set to output
        id: testskip
        env:
          SKIPFOUND: ${{ contains( join(github.event.commits.*.message, ' '), '#skip' ) }}
        run: echo "SKIP=$SKIPFOUND" >> "$GITHUB_OUTPUT"
      - name: npm install 
        run: npm install  
      - name: Lint
        run: npm run eslint
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npm run test:e2e
      - name: Trigger deployment
        if: ${{ github.event_name == 'push' && steps.testskip.outputs.SKIP == 'false' }}
        run: curl https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_API_KEY }}
      - name: Message if deployment successful
        uses: rjstone/discord-webhook-notify@89b0bf43c2c8514f70d0dcba4a706b904e8a3112
        if: ${{ success() }}
        with:
            severity: info
            text: A new version of Pokedex deployed
            details: to https://full-stack-open-pokedex-p649.onrender.com/ by ${{ github.head_commit.author.name }}
            webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
      - name: Message if deployment failed
        uses: rjstone/discord-webhook-notify@89b0bf43c2c8514f70d0dcba4a706b904e8a3112
        if: ${{ failure() }}
        with:
            severity: error
            text: Build failed
            description: commit
            details: ${{ github.head_commit.url }} by ${{ github.head_commit.author.name }} broke the build :(
            webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
  tag_release:
    needs: [simple_deployment_pipeline]
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Bump version and push tag
        if: ${{ github.event_name == 'push' && needs.simple_deployment_pipeline.outputs.SKIP == 'false' }}
        uses: anothrNick/github-tag-action@a2c70ae13a881faf2b4953baaa9e49731997ab36
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
