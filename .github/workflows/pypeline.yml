name: Deployment pipeline

on:
  push:
    branches:
      - main

jobs:
  simple-deployment-pipeline:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check style
        run: npm run eslint
      - name: test
        run: npm run test
      - name: build
        run: npm run build
