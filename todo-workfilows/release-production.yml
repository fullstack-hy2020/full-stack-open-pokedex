name: Release production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create, for example v1.0.0'
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare_release:
    name: Prepare ${{ inputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Version must look like v1.0.0"
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run eslint

      - name: Unit tests
        run: npm test -- --ci --runInBand

      - name: Build app bundle
        run: npm run build

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          command: npm run test:e2e
          start: npm run start-prod
          wait-on: http://localhost:5000
          wait-on-timeout: 120

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.version }}
          path: |
            dist
            app.js
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 30

  create_tag:
    name: Create tag ${{ inputs.version }}
    needs: prepare_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"

  deploy_pro:
    name: Deploy ${{ inputs.version }} to pro
    needs: create_tag
    runs-on: ubuntu-24.04
    environment:
      name: pro

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ inputs.version }}

      - name: Validate deployment variables
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
          PORT: ${{ vars.PORT }}
        run: |
          test -n "$DEPLOY_PATH" || { echo "Missing DEPLOY_PATH environment variable"; exit 1; }
          test -n "$PM2_APP_NAME" || { echo "Missing PM2_APP_NAME environment variable"; exit 1; }
          test -n "$PORT" || { echo "Missing PORT environment variable"; exit 1; }

      - name: Upload release files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'dist,app.js,package.json,package-lock.json'
          target: ${{ vars.DEPLOY_PATH }}

      - name: Restart application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH }}"
            npm ci --omit=dev
            export PORT="${{ vars.PORT }}"
            if pm2 describe "${{ vars.PM2_APP_NAME }}" > /dev/null 2>&1; then
              pm2 restart "${{ vars.PM2_APP_NAME }}" --update-env
            else
              pm2 start app.js --name "${{ vars.PM2_APP_NAME }}"
            fi
            pm2 save

      - name: Reserved rollout gates
        run: |
          echo "Reserved for whitelist, smoke test, canary rollout, and traffic switching."
