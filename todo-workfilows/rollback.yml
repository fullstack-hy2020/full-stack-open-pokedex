name: Rollback production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to deploy, for example v1.0.2'
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare_rollback:
    name: Prepare rollback to ${{ inputs.version }}
    runs-on: ubuntu-24.04

    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Version must look like v1.0.2"
            exit 1
          fi

      - name: Checkout selected tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --ci --runInBand

      - name: Build selected tag
        run: npm run build

      - name: Upload rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: rollback-${{ inputs.version }}
          path: |
            dist
            app.js
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 30

  deploy_pro:
    name: Deploy rollback ${{ inputs.version }} to pro
    needs: prepare_rollback
    runs-on: ubuntu-24.04
    environment:
      name: pro

    steps:
      - name: Download rollback artifact
        uses: actions/download-artifact@v4
        with:
          name: rollback-${{ inputs.version }}

      - name: Validate deployment variables
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
          PORT: ${{ vars.PORT }}
        run: |
          test -n "$DEPLOY_PATH" || { echo "Missing DEPLOY_PATH environment variable"; exit 1; }
          test -n "$PM2_APP_NAME" || { echo "Missing PM2_APP_NAME environment variable"; exit 1; }
          test -n "$PORT" || { echo "Missing PORT environment variable"; exit 1; }

      - name: Upload rollback files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'dist,app.js,package.json,package-lock.json'
          target: ${{ vars.DEPLOY_PATH }}

      - name: Restart application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH }}"
            npm ci --omit=dev
            export PORT="${{ vars.PORT }}"
            if pm2 describe "${{ vars.PM2_APP_NAME }}" > /dev/null 2>&1; then
              pm2 restart "${{ vars.PM2_APP_NAME }}" --update-env
            else
              pm2 start app.js --name "${{ vars.PM2_APP_NAME }}"
            fi
            pm2 save
